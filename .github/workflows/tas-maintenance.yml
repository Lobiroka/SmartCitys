name: Manutenção da TAS

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tas-maintenance
  cancel-in-progress: false

jobs:
  acompanhar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { run } = require('./.github/scripts/tas-maintenance.cjs');
            await run({ github, context });
