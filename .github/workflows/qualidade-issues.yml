name: Registrar falhas da pipeline

on:
  workflow_run:
    workflows: ["Testes unitários", "Regressão completa"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: qualidade-issues
  cancel-in-progress: false

jobs:
  registrar:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Só carrega código da branch padrão. Nunca baixa/executa código ou artefatos do run que falhou.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Criar issue ou atualizar ocorrência existente
        uses: actions/github-script@v7
        with:
          script: |
            const register = require('./.github/scripts/register-quality-issue.cjs');
            await register({ github, context, core });
