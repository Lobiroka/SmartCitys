name: Regressão completa

on:
  schedule:
    # 03:00 UTC = 00:00 em America/Fortaleza (UTC-3).
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: 'Diagnóstico: reusar APK de uma execução desta branch (vazio para build novo)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  regressao-completa:
    name: Regressão completa
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      KEYCLOAK_ISSUER: https://auth.darkartsbm.com/realms/smartcitys-test
      KEYCLOAK_AUDIENCE: smartcitys-api-test
      DATABASE_URL: postgresql://smartcitys_test:teste_ci@localhost:5432/smartcitys_test?schema=demand
      DATABASE_URL_DEMAND: postgresql://smartcitys_test:teste_ci@localhost:5432/smartcitys_test?schema=demand
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: smartcitys_test
          POSTGRES_PASSWORD: teste_ci
          POSTGRES_DB: smartcitys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U smartcitys_test -d smartcitys_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências do mobile
        run: npm ci

      - name: Validar configuração E2E
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          for variable in E2E_USERNAME E2E_PASSWORD GOOGLE_MAPS_ANDROID_API_KEY; do
            if [ -z "${!variable}" ]; then
              echo "::error::Secret obrigatório ausente: $variable"
              exit 1
            fi
          done
          curl --fail --silent --show-error "$KEYCLOAK_ISSUER/.well-known/openid-configuration" -o /dev/null

      - name: Testes Unitários
        id: unitarios
        continue-on-error: true
        run: npm run mobile:test

      - name: Instalar dependências do Demand Service
        working-directory: ./apps/backend/demand-service
        run: npm ci

      - name: Preparar banco de testes
        working-directory: ./apps/backend/demand-service
        env:
          DATABASE_URL: postgresql://smartcitys_test:teste_ci@localhost:5432/smartcitys_test?schema=demand
        run: npx prisma db push

      - name: Compilar Demand Service
        working-directory: ./apps/backend/demand-service
        run: npm run build

      - name: Testes de API
        id: api
        continue-on-error: true
        working-directory: ./apps/backend/demand-service
        env:
          TEST_DATABASE_URL: postgresql://smartcitys_test:teste_ci@localhost:5432/smartcitys_test?schema=demand
        run: npm test
      - name: Instalar dependências do Metrics Service
        working-directory: ./apps/backend/metrics-service
        run: npm ci

      - name: Gerar Prisma Client do Metrics Service
        working-directory: ./apps/backend/metrics-service
        run: npm run prisma:generate

      - name: Compilar Metrics Service
        working-directory: ./apps/backend/metrics-service
        run: npm run build

      - name: Instalar dependências do Gateway
        working-directory: ./apps/backend/api-gateway
        run: npm ci

      - name: Compilar Gateway
        working-directory: ./apps/backend/api-gateway
        run: npm run build

      - name: Iniciar API temporária de testes
        run: bash .github/scripts/start-test-api.sh

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Gerar APK Android para testes
        if: ${{ inputs.apk_run_id == '' }}
        working-directory: apps/mobile
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          EXPO_PUBLIC_KEYCLOAK_ISSUER: https://auth.darkartsbm.com/realms/smartcitys-test
          EXPO_PUBLIC_KEYCLOAK_CLIENT_ID: smartcitys-mobile-test
          EXPO_PUBLIC_API_URL: http://localhost:8080
        run: |
          npx expo prebuild --platform android --no-install
          python ../../.github/scripts/configure-test-android.py
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=2

      - name: Conferir código do APK reutilizado
        if: ${{ inputs.apk_run_id != '' }}
        env:
          APK_RUN_ID: ${{ inputs.apk_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-reused-apk.cjs

      - name: Baixar APK para diagnóstico
        if: ${{ inputs.apk_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: apk-e2e-${{ inputs.apk_run_id }}
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ github.token }}
          path: apps/mobile/android/app/build/outputs/apk/release

      - name: Instalar Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev -o "$RUNNER_TEMP/install-maestro.sh"
          bash "$RUNNER_TEMP/install-maestro.sh"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Salvar APK para diagnóstico
        if: ${{ inputs.apk_run_id == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-e2e-${{ github.run_id }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 2

      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testes End-to-End (E2E)
        id: e2e
        continue-on-error: true
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          MAESTRO_CLI_NO_ANALYTICS: 'true'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 3072 -cores 2 -skin 720x1280
          disable-animations: true
          script: bash .github/scripts/run-e2e.sh

      - name: Salvar evidências E2E
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-e2e-${{ github.run_id }}
          path: test-results/e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Verificar resultado da regressão
        if: ${{ !cancelled() }}
        env:
          UNITARIOS: ${{ steps.unitarios.outcome }}
          API: ${{ steps.api.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          printf 'Unitários: %s\nAPI: %s\nE2E: %s\n' "$UNITARIOS" "$API" "$E2E" >> "$GITHUB_STEP_SUMMARY"
          test "$UNITARIOS" = success
          test "$API" = success
          test "$E2E" = success
