name: Testes unitários

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unitarios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unitarios:
    name: Unitários e componentes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Iniciar coleta de qualidade
        run: |
          mkdir -p test-results
          date +%s > test-results/started-at
      - name: Validar gerador de relatórios
        run: python -m unittest discover -s .github/scripts/tests -v
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar registro de issues
        run: node --test .github/scripts/tests/quality-issue.test.cjs
      - name: Instalar dependências
        run: npm ci
      - name: Executar todos os testes unitários e de componentes
        id: unitarios
        continue-on-error: true
        run: python .github/scripts/run-quality-tests.py mobile
      - name: Gerar relatórios de qualidade
        if: ${{ !cancelled() }}
        env:
          MOBILE_OUTCOME: ${{ steps.unitarios.outcome }}
          PRE_REPORT_STATUS: ${{ job.status }}
        run: python .github/scripts/quality-report.py --expected mobile
      - name: Salvar resultados e relatórios
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qualidade-unitarios-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: error
          retention-days: 14
      - name: Preservar resultado dos testes
        if: ${{ !cancelled() }}
        env:
          MOBILE_OUTCOME: ${{ steps.unitarios.outcome }}
        run: test "$MOBILE_OUTCOME" = success

  publicar-preview:
    name: Publicar OTA Android preview
    needs: unitarios
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: expo-android-preview
      cancel-in-progress: false
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - name: Checkout do commit aprovado
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conferir compatibilidade com o preview instalado
        id: ota
        env:
          BASE_SHA: ${{ vars.EXPO_PREVIEW_BASE_SHA || '645b1df1a73736454708a833198e62b2ee71f233' }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"; then
            echo "::error::Informe o SHA completo de um commit validado da main como base do preview."
            exit 1
          fi

          changed_files=$(git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA")
          has_app_changes=false
          while IFS= read -r path; do
            case "$path" in
              ''|README.md|.github/*|.maestro/*|apps/mobile/*.md) ;;
              apps/mobile/app/*|apps/mobile/src/*|apps/mobile/assets/*|apps/mobile/components/*|apps/mobile/constants/*|apps/mobile/hooks/*|apps/mobile/global.css)
                has_app_changes=true
                ;;
              *)
                echo "::notice::OTA automático pausado por alteração fora do escopo: $path. Valide o deploy da API ou o APK antes de atualizar a base do preview."
                exit 0
                ;;
            esac
          done <<< "$changed_files"

          echo "publish=$has_app_changes" >> "$GITHUB_OUTPUT"
      - name: Configurar Node.js
        if: steps.ota.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        if: steps.ota.outputs.publish == 'true'
        run: npm ci
      - name: Publicar atualização Android no Expo
        if: steps.ota.outputs.publish == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Valor temporário para resolver o app config antes de carregar as variáveis do EAS.
          GOOGLE_MAPS_ANDROID_API_KEY: ota-config-placeholder
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::notice::Cadastre o secret EXPO_TOKEN para habilitar a publicação automática."
            exit 0
          fi
          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "::notice::A main avançou. Esta execução não publicará um commit antigo."
            exit 0
          fi
          npx --yes eas-cli@27.7.1 update --channel preview --environment preview \
            --platform android --message "SmartCitys preview ${GITHUB_SHA:0:7}" --non-interactive
