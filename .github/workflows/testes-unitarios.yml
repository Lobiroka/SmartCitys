name: Testes unitários

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unitarios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unitarios:
    name: Unitários e componentes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci
      - name: Executar todos os testes unitários e de componentes
        run: npm run mobile:test
