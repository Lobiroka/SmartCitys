appId: com.darkartsbm.smartcitys
name: Registrar ocorrência e confirmar retorno à lista
---
- tapOn:
    id: "tab-occurrences"
- extendedWaitUntil:
    visible:
      id: "occurrence-create-button"
    timeout: 30000
- tapOn:
    id: "occurrence-create-button"

- scrollUntilVisible:
    element:
      id: "occurrence-save-button"
    direction: DOWN
- tapOn:
    id: "occurrence-save-button"
- assertVisible: "Preencha título e descrição."

- scrollUntilVisible:
    element:
      id: "occurrence-title-input"
    direction: UP
- tapOn:
    id: "occurrence-title-input"
- inputText: "${E2E_TITLE}"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "occurrence-description-input"
    direction: DOWN
- tapOn:
    id: "occurrence-description-input"
- inputText: "Ocorrencia criada pelo teste automatizado"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "occurrence-address-input"
    direction: DOWN
- tapOn:
    id: "occurrence-address-input"
- inputText: "Rua do Teste, 100"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "occurrence-location-button"
    direction: DOWN
- tapOn:
    id: "occurrence-location-button"
- scrollUntilVisible:
    element:
      id: occurrence-coordinates
    direction: UP
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: occurrence-coordinates
      text: ".*-?\\d+\\.\\d{6}, -?\\d+\\.\\d{6}.*"
    timeout: 30000
- runFlow:
    when:
      true: ${typeof E2E_WITH_PHOTO !== 'undefined' && E2E_WITH_PHOTO === '1'}
    commands:
      - scrollUntilVisible:
          element:
            id: occurrence-camera-button
          direction: DOWN
      - tapOn:
          id: occurrence-camera-button
      - extendedWaitUntil:
          visible:
            id: occurrence-capture-button
            enabled: true
          timeout: 30000
      - tapOn:
          id: occurrence-capture-button
      - extendedWaitUntil:
          notVisible:
            id: occurrence-capture-button
          timeout: 30000
      - scrollUntilVisible:
          element:
            id: occurrence-photo-preview
          direction: DOWN
          timeout: 30000
      - assertVisible:
          id: occurrence-photo-preview

- scrollUntilVisible:
    element:
      id: "occurrence-save-button"
    direction: DOWN
- tapOn:
    id: "occurrence-save-button"

- extendedWaitUntil:
    notVisible:
      id: "occurrence-save-button"
    timeout: 60000
- tapOn:
    id: "tab-occurrences"
- extendedWaitUntil:
    visible: "${E2E_TITLE}"
    timeout: 60000
