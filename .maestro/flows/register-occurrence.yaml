appId: com.darkartsbm.smartcitys
name: Autenticar e registrar ocorrência
---
- launchApp:
    clearState: true
    permissions:
      location: allow
      camera: allow
      notifications: allow

- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn:
          id: "android:id/aerr_close"
- assertVisible: "Smart City"
- tapOn:
    id: "login-button"

- runFlow:
    when:
      visible:
        id: "com.android.chrome:id/signin_fre_dismiss_button"
    commands:
      - tapOn:
          id: "com.android.chrome:id/signin_fre_dismiss_button"
      - extendedWaitUntil:
          visible:
            id: "username|login-button|tab-occurrences"
          timeout: 60000
      - runFlow:
          when:
            visible:
              id: "login-button"
          commands:
            - tapOn:
                id: "login-button"
                
- extendedWaitUntil:
    visible:
      id: "username|tab-occurrences"
    timeout: 60000

- runFlow:
    when:
      visible:
        id: "username"
    commands:
      - tapOn:
          id: "username"
      - inputText: "${E2E_USERNAME}"
      - tapOn:
          id: "password"
      - inputText: "${E2E_PASSWORD}"
      - hideKeyboard
      - tapOn:
          id: "kc-login"

- extendedWaitUntil:
    visible: "Menu do Perfil"
    timeout: 60000
- tapOn:
    id: "tab-occurrences"
- extendedWaitUntil:
    visible:
      id: "occurrence-create-button"
    timeout: 30000
- tapOn:
    id: "occurrence-create-button"

- scrollUntilVisible:
    element:
      id: "occurrence-save-button"
    direction: DOWN
- tapOn:
    id: "occurrence-save-button"
- assertVisible: "Preencha título e descrição."

- scrollUntilVisible:
    element:
      id: "occurrence-title-input"
    direction: UP
- tapOn:
    id: "occurrence-title-input"
- inputText: "${E2E_TITLE}"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "occurrence-description-input"
    direction: DOWN
- tapOn:
    id: "occurrence-description-input"
- inputText: "Ocorrencia criada pelo teste automatizado"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "occurrence-address-input"
    direction: DOWN
- tapOn:
    id: "occurrence-address-input"
- inputText: "Rua do Teste, 100"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "occurrence-location-button"
    direction: DOWN
- tapOn:
    id: "occurrence-location-button"
- scrollUntilVisible:
    element: ".*-?\\d+\\.\\d{6}, -?\\d+\\.\\d{6}.*"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "occurrence-save-button"
    direction: DOWN
- tapOn:
    id: "occurrence-save-button"

- extendedWaitUntil:
    notVisible:
      id: "occurrence-save-button"
    timeout: 60000
- tapOn:
    id: "tab-occurrences"
- extendedWaitUntil:
    visible: "${E2E_TITLE}"
    timeout: 60000

