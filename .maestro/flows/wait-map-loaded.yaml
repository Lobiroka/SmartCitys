appId: com.darkartsbm.smartcitys
name: Aguardar tiles do mapa e localização antes da captura
---
- extendedWaitUntil:
    visible:
      id: main-map-loaded
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible:
    id: main-map-loaded
- assertNotVisible: Buscando localização...
