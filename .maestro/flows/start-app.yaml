appId: com.darkartsbm.smartcitys
name: Iniciar app limpo no APK ou development
---
- launchApp:
    clearState: true
    permissions:
      location: allow
      camera: allow
      notifications: allow

- runFlow:
    when:
      true: ${typeof MAESTRO_E2E_DEV_CLIENT !== 'undefined' && MAESTRO_E2E_DEV_CLIENT === '1'}
    commands:
      - openLink: "exp+wb://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081&disableOnboarding=1&disableFab=1&disableAutoLaunch=1"

- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn:
          id: "android:id/aerr_close"
- extendedWaitUntil:
    visible: "Smart City"
    timeout: 60000
- assertVisible: "Smart City"
