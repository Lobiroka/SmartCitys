appId: com.darkartsbm.smartcitys
name: MVP - autenticação e criação de ocorrência
---
- runFlow: flows/register-occurrence.yaml

# TC-03: sair e reabrir sem limpar dados comprova o logout local.
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible: "Menu do Perfil"
    timeout: 30000
- tapOn: "Menu do Perfil"
- extendedWaitUntil:
    visible: "Sair"
    timeout: 10000
- tapOn: "Sair"
- extendedWaitUntil:
    visible:
      id: "login-button"
    timeout: 30000
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "login-button"
    timeout: 30000
- assertNotVisible: "Sair"
